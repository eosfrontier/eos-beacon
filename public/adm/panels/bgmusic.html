<div class="adm-panel">
    <div class="adm-panel-header">
        <div class="adm-panel-title">
            <i class="fa fa-music"></i>&nbsp;Background Music
        </div>
    </div>
    <div class="adm-panel-content">
        <div id="bgmusic-status" style="display: none;">
            <h4>Now Playing</h4>
            <p style="margin-bottom: 5px;"><strong>Playlist:</strong> <span id="bgmusic-current-playlist">None</span></p>
            <p><strong>Track:</strong> <span id="bgmusic-current-track">N/A</span></p>
            <div class="items">
                <button id="bgmusic-prev-btn" class="btn btn-ui btn-ui-holo" onclick="prevBgMusicTrack()" disabled>
                    <i class="fa fa-step-backward"></i>&nbsp;Prev
                </button>
                <button id="bgmusic-pause-btn" class="btn btn-ui btn-warning" onclick="toggleBgMusicPause()" disabled>
                    <i class="fa fa-pause"></i>&nbsp;Pause
                </button>
                <button id="bgmusic-next-btn" class="btn btn-ui btn-ui-holo" onclick="nextBgMusicTrack()" disabled>
                    <i class="fa fa-step-forward"></i>&nbsp;Next
                </button>
            </div>
            <div id="bgmusic-time-control" style="margin-top: 15px;">
                <input type="range" id="bgmusic-time-slider" class="vjs-volume-bar vjs-slider-bar" style="width: 100%;" min="0" max="100" step="0.1" value="0" onmousedown="setScrubbing(true)" onchange="seekBgMusic(this.value); setScrubbing(false);" oninput="onBgMusicSliderInput(this.value)" disabled>
                <div style="display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px;">
                    <span id="bgmusic-current-time">0:00</span>
                    <span id="bgmusic-duration">0:00</span>
                </div>
            </div>
            <div class="vjs-volume-control vjs-control" style="margin-top: 15px; margin-bottom: 10px;">
                <label for="bgmusic-volume-slider" style="display: block; text-align: left; margin-bottom: 5px;">
                    Volume: <span id="bgmusic-volume-label">50</span>%
                </label>
                <input type="range" id="bgmusic-volume-slider" class="vjs-volume-bar vjs-slider-bar" min="0" max="100" step="1" oninput="setBgMusicVolume(this.value)" onchange="setBgMusicVolume(this.value)" disabled>
            </div>
            <hr>
        </div>

        <h4>Select Playlist</h4>
        <p>Select a playlist to start a shuffled background music loop for all clients. Playlists are folders located in <code>/public/sounds/bgmusic/</code>.</p>
        <div id="bgmusic-playlist-buttons" class="items">
            <!-- Playlist buttons will be inserted here -->
        </div>
        <hr>
        <button class="btn btn-ui btn-danger" onclick="stopBgMusicOnly()">
            <i class="fa fa-stop-circle"></i>&nbsp;Stop Background Music
        </button>
    </div>
</div>

<script>
    (function() {
        const playlistContainer = document.getElementById('bgmusic-playlist-buttons');

        function createPlaylistButtons(playlists) {
            playlistContainer.innerHTML = ''; // Clear existing buttons
            if (!playlists || playlists.length === 0) {
                playlistContainer.innerHTML = '<p>No playlists found.</p>';
                return;
            }

            playlists.forEach(playlistName => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-ui btn-ui-holo';
                btn.innerHTML = `<i class="fa fa-play-circle"></i>&nbsp;${playlistName}`;
                btn.onclick = () => startBgMusicPlaylist(playlistName, 15);
                playlistContainer.appendChild(btn);
            });
        }

        // Initial state update on panel load
        updateBgMusicPanelState();

        socket.on('sendBgMusicPlaylists', createPlaylistButtons);
        socket.emit('getBgMusicPlaylists');
    })();
</script>
