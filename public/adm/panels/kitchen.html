<h2><i class="fa fa-cutlery"></i>&nbsp;Kitchen Terminal</h2>

<hr />
<div class="items">
  <button class="btn btn-outline-success btn-lg btn-block" onclick="sendBroadCast(bcreset);">
    <i class="fa fa-check"></i>&nbsp;CLEAR BROADCASTS
  </button>
  <div class="btn btn-danger" onclick="stopAllAudio();"><i class="fa fa-stop"></i>&nbsp;STOP AUDIO</div>
  </div>
  <h4 class="holoContrast"><i class="fa fa-cutlery"></i>&nbsp;Food Related Alerts</h4>
  <div class="items"></div>
  <button class="btn btn-block btn-ui btn-ui-holo" onclick="sendBroadCast(bclunch);">
    <i class="fa fa-cutlery"></i>&nbsp;KITCHEN: LUNCH
  </button>

  <button class="btn btn-block btn-ui btn-ui-holo" onclick="sendBroadCast(bcdinner);">
    <i class="fa fa-cutlery"></i>&nbsp;KITCHEN: DINNER
  </button>

  <button class="btn btn-block btn-ui btn-ui-holo-alt" onclick="sendBroadCast(bcdishes);">
    <i class="fa fa-cutlery"></i>&nbsp;KITCHEN: DISHES
  </button>
  <h4 class="holoContrast"><i class="fa fa-calendar-days"></i>&nbsp;Day/Time-Based Food Alerts</h4>
  <div class="items"></div>
  <h5 class="holoContrast">Day 1 (evening of arrival)</h5>
  <button class="btn btn-block btn-ui btn-ui-holo" onclick="sendBroadCast(bcdinnerdate1);">
    <i class="fa fa-utensils"></i>&nbsp;Dinner Date &amp; Free Time
  </button>
  <h5 class="holoContrast">Day 2 (first full day)</h5>
  <button class="btn btn-block btn-ui btn-ui-holo" onclick="sendBroadCast(bcbreakfast1);">
    <i class="fa fa-mug-saucer"></i>&nbsp;FIRST DAY Breakfast
  </button>
  <h5 class="holoContrast">Day 3</h5>
  <button class="btn btn-block btn-ui btn-ui-holo" onclick="sendBroadCast(bcbreakfast3);">
    <i class="fa fa-mug-saucer"></i>&nbsp;SECOND DAY Breakfast
  </button>
</div>
