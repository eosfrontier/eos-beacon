<div id="adm-panel-container" class="adm-tab default-border col-xs-12">
  <!-- Panel content will be loaded here -->
</div>

<script>
  $(document).ready(function () {
    // Use event delegation for dynamically loaded content
    // Exclude form submit buttons, as they may have their own logic.
    $('#adm-panel-container').on('click', 'button:not([type="submit"])', function (e) {
      /* extra scripts: add a modifier to prevent disabled buttons from being used regardless. */
      if ($(this).attr('disabled')) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }

      /* disable buttons temporarily to prevent spamming */
      $('button').addClass('disabled').attr("disabled", true);

      /* remove the disabled modifier after an XXXX amount of miliseconds. */
      setTimeout(function () {
        $('button').removeClass('disabled').attr("disabled", false);
        $('#adm-panel-container').removeClass('flash');
      }, 3500);
    });
  });
</script>
