<div id="admMENU" class="admMENU">
  <!-- Admin menu buttons will be generated here -->
</div>

<script src="/adm/tabs.js"></script>
<script>
  function navigateADM(tabId) {
    const tabData = adminTabs.find(t => t.id === tabId);
    if (!tabData) return;

    const panelContainer = $('#adm-panel-container');
    const url = `/adm/panels/${tabData.file}.html`;

    panelContainer.load(url, function(response, status, xhr) {
      if (status == "error") {
        panelContainer.html("Error loading panel: " + xhr.status + " " + xhr.statusText);
      }
      // Highlight active button
      $('.adm-nav').removeClass('active');
      $(`#btn-${tabId}`).addClass('active');
    });
  }

  $(document).ready(function(){
    const admRANK = parseInt(getCookie('rank'), 10);
    const menuContainer = $('#admMENU');

    if (isNaN(admRANK) || admRANK < 1 || admRANK > 4) {
      logout();
      return;
    }

    const defaultTab = adminTabs.find(tab => tab.ranks.includes(admRANK));

    adminTabs.forEach(tab => {
      if (tab.ranks.includes(admRANK)) {
        const isActive = (defaultTab && tab.id === defaultTab.id) ? 'active' : '';
        const button = `
          <div id="btn-${tab.id}" class="btn adm-nav ${tab.className} ${isActive}" onclick="navigateADM('${tab.id}');">
            <i style="font-size:133%" class="fa ${tab.icon}"></i><br/>${tab.name}
          </div>`;
        menuContainer.append(button);
      }
    });

    // Load the default tab
    if (defaultTab) {
      navigateADM(defaultTab.id);
    }
  });
</script>
